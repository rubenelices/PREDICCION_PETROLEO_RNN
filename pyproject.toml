[project]
name = "prediccion-petroleo-rnn"
version = "0.1.0"
description = "Predicción del precio del Brent a 5, 63 y 252 días con RNN, LSTM y GRU, con aplicación Streamlit para cuantificar y explicar la incertidumbre."
authors = [
    {name = "Rubén Elices Rodriguez", email = "relicrod@myuax.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "plotly (>=7.1.0,<8.0.0)",
    "optuna (>=5.0.0,<6.0.0)",
    "streamlit (>=1.66.1,<2.0.0)",
    "torch (>=2.15.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

# Torch CPU-only wheels on Linux/Windows: the default Linux wheel bundles CUDA
# (~2 GB), which is unnecessary here and too heavy for deploying the app.
# macOS wheels on PyPI are already CPU/MPS only.
[tool.poetry.dependencies]
torch = [
    {version = ">=2.15.0,<3.0.0", source = "pytorch-cpu", markers = "sys_platform != 'darwin'"},
    {version = ">=2.15.0,<3.0.0", markers = "sys_platform == 'darwin'"},
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "nbconvert (>=7.17.2,<8.0.0)"
]
